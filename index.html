<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Date Countdown</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 40px auto;
        text-align: center;
    }
    input {
        padding: 10px;
        font-size: 16px;
        margin-top: 10px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        margin-top: 20px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h2>Countdown Timer</h2>
<div id="content"></div>

<script>
    function getUrlDate() {
        const params = new URLSearchParams(window.location.search);
        return params.get("date");
    }

    function saveDate(date) {
        localStorage.setItem("countdownDate", date);
    }

    function loadSavedDate() {
        return localStorage.getItem("countdownDate");
    }

    function calculateDays(targetDate) {
        const now = new Date();
        const target = new Date(targetDate);
        const diff = target - now;
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    function renderCountdown(date) {
        const days = calculateDays(date);
        document.getElementById("content").innerHTML = `
            <h3>Countdown to: ${date}</h3>
            <h1>${days} days remaining</h1>
            <button onclick="shareWhatsApp('${date}')">Share on WhatsApp</button>
        `;
    }

    function renderInput() {
        document.getElementById("content").innerHTML = `
            <p>No date found. Enter a target date:</p>
            <input type="date" id="dateInput">
            <button onclick="setDate()">Start Countdown</button>
        `;
    }

    function setDate() {
        const date = document.getElementById("dateInput").value;
        if (!date) return alert("Please select a date");
        saveDate(date);
        renderCountdown(date);
    }

    function shareWhatsApp(date) {
        const url = window.location.origin + window.location.pathname + "?date=" + date;
        const days = calculateDays(date);
        const message = `${days} days to go: ${url}`;
        const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, "_blank");
    }

    // Main logic
    const urlDate = getUrlDate();
    const savedDate = loadSavedDate();

    if (urlDate) {
        saveDate(urlDate);
        renderCountdown(urlDate);
    } else if (savedDate) {
        renderCountdown(savedDate);
    } else {
        renderInput();
    }
</script>

</body>
</html>
